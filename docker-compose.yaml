version: '3.8'

services:
  # --------------------------------------------------------------------------
  # 1. SERVEUR MATRIX : Conduit (Ultra-léger en Rust)
  # --------------------------------------------------------------------------
  conduit:
    image: matrixconduit/matrix-conduit:latest
    restart: unless-stopped
    environment:
      CONDUIT_SERVER_NAME: matrix.oussamma.tn
      CONDUIT_DATABASE_BACKEND: rocksdb
      CONDUIT_PORT: 6167
      CONDUIT_MAX_REQUEST_SIZE: 20000000
      CONDUIT_ALLOW_REGISTRATION: "false"
      CONDUIT_ALLOW_FEDERATION: "false"
      CONDUIT_TRUSTED_SERVERS: '["matrix.org"]'
      CONDUIT_ADDRESS: "0.0.0.0"
    volumes:
      - conduit-data:/var/lib/matrix-conduit
    networks:
      - default

  # --------------------------------------------------------------------------
  # 2. PONT (BRIDGE) META : mautrix-meta
  # --------------------------------------------------------------------------
  mautrix-meta:
    image: dock.mau.dev/mautrix/meta:latest
    restart: unless-stopped
    volumes:
      - bridge-data:/data
    networks:
      - default
    depends_on:
      - conduit

  # --------------------------------------------------------------------------
  # 3. INTERFACE WEB ET DIGEST IA (FastAPI)
  # --------------------------------------------------------------------------
  web:
    build:
      context: ./summarizer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8000
      MATRIX_HOMESERVER_URL: "http://conduit:6167"
      MATRIX_BOT_USERNAME: "@summarizer:matrix.oussamma.tn"
      MATRIX_BOT_PASSWORD: "${SUMMARIZER_BOT_PASSWORD:-admin123}"
      OPENAI_API_BASE: "${AI_PROXY_URL:-https://ai.oussamma.tn/v1}"
      OPENAI_API_KEY: "${AI_API_KEY:-}"
      CRON_SCHEDULE_HOUR: "23"
    volumes:
      - summarizer-data:/app/data
    networks:
      - default
    depends_on:
      - conduit

volumes:
  conduit-data:
  bridge-data:
  summarizer-data: